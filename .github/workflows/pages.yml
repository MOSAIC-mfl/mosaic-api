# Check, test and publish the static API on GitHub Pages.
#
#   check   on every pull request and every run: ruff, format, mypy, import layers, pytest.
#   build   only from main, after check passes: clone the MOSAIC catalogue (records, landscape
#           profiles) and the MOSAIC standard (its tool builds the catalogue), harvest every source
#           (incremental, from the cached snapshot), export the static API. If every source
#           failed, nothing is published (the last good deploy stays).
#   deploy  publish the export on GitHub Pages (Settings > Pages > Source: GitHub Actions).
#   alert   after deploy, only if some source failed: the API was published with that source's
#           previous records, and this job fails so the run shows red and GitHub notifies.
#
# The catalogue comes from MOSAIC-mfl/catalog, main; the standard from MOSAIC-mfl/mosaic-standard,
# main. The repository variables CATALOG_REF and STANDARD_REF force a branch or tag.
name: Check and publish

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"          # daily: CDH changes (GitHub often starts it hours later)
  repository_dispatch:
    types: [catalog-updated]      # sent by the catalogue's Publish (job notify-api) after each merge
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      - run: lint-imports
      - run: pytest -q

  build:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      degraded: ${{ steps.harvest.outputs.degraded }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Clone the MOSAIC catalogue
        env:
          CATALOG_REPO: https://github.com/MOSAIC-mfl/catalog.git
          CATALOG_REF: ${{ vars.CATALOG_REF }}
        run: |
          set -euo pipefail
          git clone --quiet --branch "${CATALOG_REF:-main}" "$CATALOG_REPO" _catalog
          echo "Catalogue: $(git -C _catalog rev-parse --abbrev-ref HEAD) @ $(git -C _catalog rev-parse --short HEAD)"
      # Full history on purpose: the build takes created / updated from git log.
      - name: Clone the MOSAIC standard
        env:
          STANDARD_REF: ${{ vars.STANDARD_REF || 'main' }}
        run: |
          git clone --quiet --depth 1 --branch "$STANDARD_REF" https://github.com/MOSAIC-mfl/mosaic-standard.git _standard
          echo "Standard: $(git -C _standard rev-parse --short HEAD)"
      - name: Build the catalogue (records and landscape profiles, with the standard)
        run: |
          pip install -e ./_standard
          python -m mosaic_catalog --catalog _catalog build --out _catalog/dist
      - run: pip install -e .
      # The previous snapshot makes the harvest incremental.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: state
          key: snapshot-${{ github.run_id }}
          restore-keys: snapshot-
      - name: Harvest
        id: harvest
        run: |
          set +e
          python -m mosaic_api --config config/mosaic-api.ci.yaml harvest
          code=$?
          set -e
          # 0 every source read; 2 some failed and kept their previous records; 1 all failed
          if [ "$code" -eq 2 ]; then
            echo "::warning title=Harvest degraded::A source failed; its previous records are published (see the log above)"
            echo "degraded=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
      - run: python -m mosaic_api --config config/mosaic-api.ci.yaml export --out _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  alert:
    needs: [build, deploy]
    if: needs.build.outputs.degraded == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "::error title=A source failed::The API was published, but at least one source could not be harvested and kept its previous records. The harvest step of the build job says which and why."
          exit 1
