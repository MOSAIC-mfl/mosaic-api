# mosaic-api configuration. Paths are relative to this file.
#
# Local development: the repos sit side by side (D:\Code\Mosaic\mosaic-catalog, ...\cdh\cdh-catalog).
# Published (GitHub Actions): use the https locations in comments.

# The MOSAIC standard (vocabularies, crosswalks, schemas) as published by mosaic-catalog.
standard: ../../mosaic-catalog/dist
# standard: https://mosaic-mfl.github.io/mosaic-catalog

state: ../state/snapshot.json   # harvested resources (one JSON file, no database)
export_dir: ../site             # static API written here for GitHub Pages

# Remote reads are only allowed to these hosts (https only, also after redirects).
allowed_hosts:
  - mosaic-mfl.github.io
  - github.com
  - codeload.github.com
  - raw.githubusercontent.com
max_download_mb: 50

sources:
  - id: mosaic
    name: MOSAIC
    type: mosaic_catalog
    translator: mosaic
    format: mosaic-v0.1
    location: ../../mosaic-catalog/dist
    # location: https://mosaic-mfl.github.io/mosaic-catalog
    homepage: https://mosaic-mfl.github.io/website/
    record_url_template: https://mosaic-mfl.github.io/website/catalogue/{id}/

  - id: cdh
    name: CGIAR Climate Data Hub
    type: git_yaml
    translator: cdh
    format: cdh-yaml-v0.5
    location: ../../cdh/cdh-catalog
    # location: https://github.com/CGIAR-Climate-Data-Hub/cdh-catalog
    ref: main
    pattern: records/*/*.yaml
    homepage: https://cgiar-climate-data-hub.github.io/
    record_url_template: https://github.com/CGIAR-Climate-Data-Hub/cdh-catalog/blob/{ref}/{path}

http:
  cors_origins:
    - http://localhost:4321     # mosaic-web: npm run dev / preview
    - http://127.0.0.1:4321
    - https://mosaic-mfl.github.io
  max_page_size: 100
  expose_emails: true   # project decision: contact e-mails are public
