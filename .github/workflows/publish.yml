# Harvest every catalogue and publish the static API on GitHub Pages.
# NOT ACTIVE YET (local repo). Uses config/mosaic-api.published.yaml (https locations).
name: Publish static API

on:
  schedule:
    - cron: "17 5 * * *"          # daily
  repository_dispatch:
    types: [catalog-updated]      # sent by mosaic-catalog after it publishes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # TODO pin to a commit SHA before publishing
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # The previous snapshot makes the harvest incremental.
      - uses: actions/cache@v4
        with:
          path: state
          key: snapshot-${{ github.run_id }}
          restore-keys: snapshot-
      - run: python -m mosaic_api --config config/mosaic-api.published.yaml harvest
      - run: python -m mosaic_api --config config/mosaic-api.published.yaml export --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
